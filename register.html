<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация / Маркетплейс</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">
  <h1>Регистрация</h1>
  <form class="register-mode">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="email" placeholder="Почта" minlength="6" required>
    <input type="password" placeholder="Пароль" minlength="6" required>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p>Уже есть аккаунт? <a href="login.html">Вход</a></p>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>

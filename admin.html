<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель / Маркетплейс</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-container">
  <button class="logout-btn" onclick="logout()">Выход</button>
  <h1>Админ-панель</h1>
  
  <div class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('users')">Пользователи</button>
    <button class="tab-btn" onclick="switchTab('products')">Товары</button>
  </div>

  <!-- Вкладка пользователей -->
  <div id="users-tab" class="tab-content active">
    <button class="add-btn" onclick="openUserModal()">Добавить пользователя</button>
    <table id="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Логин</th>
          <th>Имя</th>
          <th>Роль</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Вкладка товаров -->
  <div id="products-tab" class="tab-content">
    <button class="add-btn" onclick="openProductModal()">Добавить товар</button>
    <table id="products-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Название</th>
          <th>Описание</th>
          <th>Цена</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Модальное окно для пользователя -->
<div id="user-modal" class="modal">
  <div class="modal-content">
    <h2 id="user-modal-title">Добавить пользователя</h2>
    <form id="user-form">
      <input type="hidden" id="user-id">
      <input type="text" id="user-login" placeholder="Логин" required>
      <input type="password" id="user-password" placeholder="Пароль" required>
      <input type="text" id="user-name" placeholder="Имя" required>
      <select id="user-role" required>
        <option value="user">Пользователь</option>
        <option value="admin">Администратор</option>
      </select>
      <div class="modal-buttons">
        <button type="button" class="cancel-btn" onclick="closeUserModal()">Отмена</button>
        <button type="submit" class="save-btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Модальное окно для товара -->
<div id="product-modal" class="modal">
  <div class="modal-content">
    <h2 id="product-modal-title">Добавить товар</h2>
    <form id="product-form">
      <input type="hidden" id="product-id">
      <input type="text" id="product-name" placeholder="Название" required>
      <textarea id="product-description" placeholder="Описание" required></textarea>
      <input type="number" id="product-price" placeholder="Цена" required>
      <label>Изображение:</label>
      <input type="file" id="product-image-file" accept="image/*">
      <input type="text" id="product-image" placeholder="или URL изображения">
      <div class="modal-buttons">
        <button type="button" class="cancel-btn" onclick="closeProductModal()">Отмена</button>
        <button type="submit" class="save-btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
